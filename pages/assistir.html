<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistir</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
        }

        #player-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #player-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        #backButton {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 999;
            padding: 10px 20px;
            background-color: rgba(0, 0, 0, 0.6);
            color: #ffffff;
            border: 1px solid #ffffff;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.2s ease;
        }

        #backButton:hover {
            background-color: rgba(255, 255, 255, 0.15);
        }
    </style>
</head>
<body>

    <button id="backButton" onclick="window.history.back()">← Voltar</button>

    <div id="player-container">
        <iframe
            id="player-iframe"
            src=""
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen
        ></iframe>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const link = params.get("link");

        const iframe = document.getElementById("player-iframe");

        if (link) {
            iframe.src = link;
        } else {
            document.getElementById("player-container").innerHTML =
                "<p style='color: white; text-align: center;'>Nenhum vídeo encontrado.</p>";
        }
    </script>
    <footer>
         <p>&copy; 2024 NetBlue. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
